# Verificação dos links do Vivino pelo Google (Serper) — ver
# batch/vivino-verificar.mjs e db/vivino.sql. SÓ À MÃO, de propósito: cada
# vinho gasta uma pesquisa do limite do Serper. Actions → "Vivino — verificar
# links (Serper)" → Run workflow. Trata a fila primeiro (os vinhos pedidos na
# ficha com "🍷 Verificar no Vivino") e depois os nunca verificados.
#
# O motor que abre as páginas do Vivino (MOTOR=browser) NÃO corre aqui: o
# Vivino recusa-o a partir dos servidores do GitHub (403, 25/09/2026). Corre
# no computador do admin — ver batch/README.md.
name: Vivino — verificar links (Serper)

on:
  workflow_dispatch:
    inputs:
      limite:
        description: "Quantos vinhos (= pesquisas Serper gastas). Vazio = o das Definições"
        required: false
        default: ""
      ensaio:
        description: "Ensaio: pesquisa mas não grava nada"
        type: boolean
        default: false

concurrency:
  group: vivino
  cancel-in-progress: false

jobs:
  verificar:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: batch
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - name: Verificar
        run: node vivino-verificar.mjs
        env:
          MOTOR: serper
          SUPABASE_URL: https://gjweqwfbnkgnibhajldc.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          SEARCH_API_KEY: ${{ secrets.SEARCH_API_KEY }}
          MANUAL: "true"
          LIMITE: ${{ inputs.limite }}
          ENSAIO: ${{ inputs.ensaio }}
          EXECUCAO: ${{ github.run_id }}
